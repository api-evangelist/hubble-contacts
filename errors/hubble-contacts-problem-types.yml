  fetched: '2026-08-04'
  probes:
  - {url: 'https://account.hubblecontacts.com/api/ucp/mcp', method: POST, http_status: 422, jsonrpc_error: -32001}
  - {url: 'https://account.hubblecontacts.com/.well-known/security.txt', http_status: 404, content_type: text/html}
  - {url: 'https://account.hubblecontacts.com/api/2026-01/graphql.json', method: POST, query: '{shop{nonexistentField}}', http_status: 200, graphql_error_code: undefinedField}

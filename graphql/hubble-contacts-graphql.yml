generated: '2026-08-04'
method: probed
source: https://account.hubblecontacts.com/api/2026-01/graphql.json
notes: >-
  Round 1 of this pipeline recorded "no GraphQL" after probing /graphql on
  api.hubblecontacts.com (404). That was the wrong host and the wrong path. The
  Shopify Storefront GraphQL API is served on Hubble's OWN storefront host at
  /api/{version}/graphql.json, it answers ANONYMOUSLY — no
  X-Shopify-Storefront-Access-Token was sent on any probe below — and full
  introspection is open. That makes it the largest machine-readable contract Hubble
  Contacts exposes, and the only one on the whole property whose complete schema can
  be read without registering anything. The SDL beside this file was printed from a
  live introspection response, not from Shopify's published documentation.
endpoint:
  url: https://account.hubblecontacts.com/api/2026-01/graphql.json
  url_pattern: https://account.hubblecontacts.com/api/{version}/graphql.json
  alternate_host: https://hubble-prod.myshopify.com/api/{version}/graphql.json
  method: POST
  content_type: application/json
  auth: none
  auth_note: >-
    Shopify Storefront API access normally requires an X-Shopify-Storefront-Access-Token
    header. On this store the endpoint answered unauthenticated introspection AND
    unauthenticated data queries with HTTP 200; the response server-timing header
    labels the call graphql;desc="storefront/query/anonymous". Anonymous access is
    read-scoped storefront data — the same class of data the public storefront renders.
  cors: 'access-control-allow-origin: *'
  platform: Shopify
  first_party: false
  first_party_note: >-
    Served from Hubble Contacts' own host under Hubble's own domain, but the schema is
    the Shopify Storefront API contract, not a Hubble-authored one. Hubble does not
    link to it from /agents.md, /llms.txt or any page on hubblecontacts.com — it is
    undocumented-but-live on their property.

aid: hubble-contacts
name: Hubble Contacts
description: 'Hubble Contacts is a New York-based direct-to-consumer vision care brand
  that sells prescription contact lenses, eyeglasses, sunglasses and eye care accessories
  on a personalized subscription model, shipping daily, weekly and monthly lenses —
  its own Classic, Hydro and SkyHy lines alongside third-party brands such as Acuvue,
  Bausch + Lomb, Biotrue and DAILIES — direct to customers at prices it advertises
  as up to 30% below comparable retail. Its public machine-readable surface is not a
  developer API but an agent-commerce one: the storefront at account.hubblecontacts.com
  publishes /llms.txt and /agents.md, a Universal Commerce Protocol (UCP) merchant
  profile at /.well-known/ucp, an MCP endpoint at /api/ucp/mcp for agent-driven
  catalog search, cart, checkout and order flows, OAuth 2.0 / OpenID Connect customer
  account discovery documents, and unauthenticated read-only product and collection
  JSON endpoints. Undocumented but wide open beside them sits the full Shopify
  Storefront GraphQL API on the same host — 416 types, anonymous, introspectable, and
  the only place the company''s subscription selling plans are modelled.'

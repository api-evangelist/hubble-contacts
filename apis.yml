apis:
- aid: hubble-contacts-ucp-commerce
  name: Hubble Contacts UCP Commerce (MCP)
  description: 'Agent-facing commerce surface for the Hubble Contacts online store,
    implementing the Universal Commerce Protocol (UCP) over MCP/JSON-RPC. Hubble''s
    own /agents.md documents the flow: discover capabilities at /.well-known/ucp,
    then call search_catalog, create_cart, create_checkout, update_checkout and
    complete_checkout against the MCP endpoint. Checkout requires contemporaneous
    buyer approval; the endpoint is rate limited per IP. tools/list is gated behind
    a registered UCP agent profile, so live tool input schemas require an
    authenticated agent identity. Served on Hubble''s host and provided natively by
    the Shopify platform.'
  humanURL: https://account.hubblecontacts.com/agents.md
  baseURL: https://account.hubblecontacts.com/api/ucp/mcp
  tags:
  - Agentic Commerce
  - MCP
  - Universal Commerce Protocol
  - Checkout
  - Catalog
  tags_raw:
  - Agentic Commerce
  - Model Context Protocol
  - Universal Commerce Protocol
  - Checkout
  - Catalog

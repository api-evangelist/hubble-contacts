  - type: LLMsTxt
    url: llms/hubble-contacts-llms.txt
- aid: hubble-contacts-storefront-json
  name: Hubble Contacts Storefront Product JSON
  description: 'Unauthenticated read-only JSON over the Hubble Contacts storefront
    catalog, documented in Hubble''s own /agents.md for agents that only need to read
    store data without transacting: /products.json for the full product list,
    /products/{handle}.json for a single product, /collections/{handle}/products.json
    for a collection, and /search?q={query}&type=product for search. Responses carry
    products with variants, options, images, tags, vendor and pricing. Provided by
    the Shopify platform on Hubble''s own host.'
  humanURL: https://account.hubblecontacts.com/collections/all
  baseURL: https://account.hubblecontacts.com
  tags:
  - Catalog
  - Product
  - E-Commerce
  - Read Only
  tags_raw:
  - Catalog
  - Products
  - E-Commerce
  - Read Only
  properties:
  - type: DataModel
    url: data-model/hubble-contacts-data-model.yml
- aid: hubble-contacts-storefront-graphql
  name: Hubble Contacts Storefront GraphQL API
  description: 'The Shopify Storefront GraphQL API as served on Hubble Contacts'' own
    host at /api/{version}/graphql.json. It answers unauthenticated: full introspection
    and real data queries both return 200 with no storefront access token, and the
    server labels the call storefront/query/anonymous. 416 types, 35 root queries and
    41 mutations cover the catalog (products, prescription variants, options,
    collections, price ranges, availability), subscription selling plans — which
    appear on no other Hubble surface even though subscription is the company''s
    business model — content (blogs, articles, pages, menus), localization and payment
    settings, cart creation and line editing through to submission for completion, and
    customer account management. Relay cursor pagination, a per-query cost budget in
    extensions.cost plus shopify-complexity-score headers, 55 @deprecated fields with
    machine-readable reasons, and a publicApiVersions query that reports its own
    supported version window. Hubble links to none of it: it appears in neither
    /agents.md, /llms.txt nor /.well-known/. Schema captured by live introspection.'
  humanURL: https://shopify.dev/docs/api/storefront
  baseURL: https://account.hubblecontacts.com/api/2026-01/graphql.json

notes: >-
  Hubble Contacts publishes no OpenAPI, so the REST side of this crosswalk is not
  operationIds but the unauthenticated storefront JSON endpoints Hubble's own
  /agents.md documents under "Read-Only Browsing". Every row binds a UCP/MCP tool to
  the REST path that exposes the nearest equivalent data. Live tools/list is gated
  behind a registered UCP agent profile, so MCP bindings are by name and documented
  semantics; confidence is set accordingly.

  ROUND 2 CHANGED THIS DOCUMENT. A third surface was found: a live, anonymous,
  fully introspectable Storefront GraphQL API on Hubble's own host. It carries real
  cart mutations, so most of what round 1 filed as "MCP-only, no public equivalent"
  is in fact reachable over GraphQL without a UCP agent profile at all — including
  cart creation, line editing, delivery addresses and handoff to checkout. Only
  payment completion and order lookup stay off the anonymous surface. GraphQL field
  names below are read from the captured SDL, not guessed.
surfaces:
  openapi: null
  openapi_note: No OpenAPI, Swagger or GraphQL SDL is published on any Hubble host.
  rest:
    base: https://account.hubblecontacts.com
    documented_at: https://account.hubblecontacts.com/agents.md
    auth: none
    endpoints:
    - GET /products.json
    - GET /products/{handle}.json
    - GET /collections/{handle}/products.json
    - GET /collections/all
    - GET /search?q={query}&type=product
    - GET /sitemap.xml
  mcp:
    url: https://account.hubblecontacts.com/api/ucp/mcp
    transport: http
    tools_list: gated
    gate: UCP agent profile required (invalid_profile_url, HTTP 422)
  graphql:
    url: https://account.hubblecontacts.com/api/2026-01/graphql.json
    schema: ../graphql/hubble-contacts-storefront.graphql
    introspection: open
    auth: none
    gated: false
    query_fields: 35
    mutation_fields: 41
    note: >-
      Shopify Storefront API served on Hubble's own host. Undocumented by Hubble —
      it appears in neither /agents.md nor /llms.txt — but fully open.
crosswalk:
- tool: search_catalog
  category: catalog
  rest: ['GET /search?q={query}&type=product']
  graphql: [search, predictiveSearch, 'products(query:)']
  binding: rest+graphql
  confidence: medium
  note: >-
    Three projections of one search core. REST returns storefront product JSON;
    GraphQL search/predictiveSearch return typed connections with facets and
    productFilters; the MCP tool returns UCP catalog results shaped by the negotiated
    dev.shopify.catalog capability.
- tool: lookup_catalog
  category: catalog
  rest: ['GET /products/{handle}.json']
  graphql: [nodes, products]
  binding: graphql
  confidence: medium
  note: >-
    lookup_catalog is a batch identifier lookup. GraphQL nodes(ids:[ID!]!) is the true
    batch equivalent — the REST path is per-handle and single-item only, so the earlier
    REST-only mapping under-described this tool.
- tool: get_product
  category: catalog
  rest: ['GET /products/{handle}.json']
  graphql: [product, productByHandle]
  binding: rest+graphql
  confidence: high
  note: >-
    Same product entity on all three surfaces; REST and productByHandle are keyed by
    handle, product() by id, MCP by UCP catalog identifier.
- tool: create_cart
  category: cart
  rest: []
  graphql: [cartCreate]
  binding: graphql
  confidence: high
  note: >-
    Round 1 filed this as MCP-only. The anonymous Storefront GraphQL surface exposes
    cartCreate directly, so a cart can be built with no UCP agent profile.
- tool: get_cart
  category: cart
  rest: []
  graphql: [cart]
  binding: graphql
  confidence: high
  note: 'Root query cart(id: ID!) returns the cart by its cart token.'
- tool: update_cart
  category: cart
  rest: []
  graphql: [cartLinesAdd, cartLinesUpdate, cartLinesRemove, cartAttributesUpdate, cartNoteUpdate, cartDiscountCodesUpdate, cartGiftCardCodesAdd, cartBuyerIdentityUpdate, cartMetafieldsSet]
  binding: graphql
  confidence: high
  note: >-
    One UCP tool fans out to nine granular GraphQL mutations; the GraphQL surface is
    strictly finer-grained here than the MCP one.
- tool: create_checkout
  category: checkout
  rest: []
  graphql: [cartPrepareForCompletion, cartBillingAddressUpdate, cartDeliveryAddressesAdd]
  binding: graphql
  confidence: medium
  note: >-
    UCP models checkout as its own object; Storefront GraphQL has no Checkout type in
    this version — the cart is promoted toward completion instead. Semantic match, not
    a structural one.
- tool: update_checkout
  category: checkout
  rest: []
  graphql: [cartDeliveryAddressesUpdate, cartDeliveryAddressesReplace, cartSelectedDeliveryOptionsUpdate, cartPaymentUpdate]
  binding: graphql
  confidence: medium
  note: Shipping address and delivery method selection map onto the cart delivery mutations.
- tool: complete_checkout
  category: checkout
  rest: []
  graphql: [cartSubmitForCompletion, cartCompletionAttempt, shopPayPaymentRequestSessionSubmit]
  binding: graphql
  confidence: medium
  note: >-
    cartSubmitForCompletion submits for payment and cartCompletionAttempt polls the
    result. Both still require a payment method the buyer authorized — the human
    approval invariant in Hubble's /agents.md is not bypassed by using GraphQL.
mcp_only:
- tool: cancel_cart
  reason: >-
    No cart-cancellation mutation exists on the Storefront GraphQL surface; carts are
    abandoned rather than cancelled. UCP-only concept.
- tool: get_checkout
  reason: >-
    No Checkout object exists in the Storefront GraphQL schema for this version, so
    there is nothing to read back by checkout id.
- tool: cancel_checkout
  reason: Same — checkout is a UCP-level object with no GraphQL counterpart here.
- tool: get_order
  reason: >-
    Order retrieval requires customer identity. The anonymous surfaces expose no
    orders; Storefront GraphQL only reaches orders through customer(customerAccessToken:)
    and Shopify has deprecated that path in favour of the Customer Account API.
    Customer-scoped access runs through the OAuth/OIDC issuer captured in authentication/.
graphql_only:
- capability: content and merchandising
  fields: [article, articles, blog, blogByHandle, blogs, page, pageByHandle, pages, menu, metaobject, metaobjects, urlRedirects, sitemap]
  note: Editorial and navigation content no MCP tool or REST JSON path exposes.
- capability: recommendations and taxonomy
  fields: [productRecommendations, productTags, productTypes]
- capability: localization and store context
  fields: [localization, locations, paymentSettings, shop, shopPayInstallmentsPricing]
  note: Country/currency/market context an agent needs before quoting a price.
- capability: customer account management
  fields: [customerCreate, customerAccessTokenCreate, customerAccessTokenRenew, customerAccessTokenDelete, customerUpdate, customerAddressCreate, customerAddressUpdate, customerAddressDelete, customerDefaultAddressUpdate, customerRecover, customerReset, customerActivate]
  note: Twelve account mutations with no MCP or REST equivalent on this property.
- capability: version introspection
  fields: [publicApiVersions]
  note: The only machine-readable version-support window Hubble serves.
